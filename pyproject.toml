[project]
name = "rpavs_erpnext_portal_guard"
authors = [{ name = "RPA", email = "emanuel@rpapm.com" }]
description = "Blocks ERPNext desk/portal for app users and redirects them to app.rpavirtualstaffing.com"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
